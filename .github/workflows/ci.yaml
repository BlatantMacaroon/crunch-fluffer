name: CI
on: [push, pull_request]

jobs:
  backend-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Test Backend
        run: |
          cd backend
          npm install
          touch .env
          npm test
        env:
          NODE_ENV: test
          CI: true # This tells Vitest we are in GitHub

  frontend-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build